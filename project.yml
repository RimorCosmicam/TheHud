# XcodeGen is the source of truth for the app target; the .xcodeproj is generated, not committed.
#
# Hand-written pbxproj is not worth maintaining for one app target, and a generated project cannot
# drift from what CI builds. To open the app in Xcode: `brew install xcodegen && xcodegen`.
name: TheHud
options:
  bundleIdPrefix: com.rimorcosmicam
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  HudCore:
    path: .

targets:
  TheHud:
    type: application
    platform: iOS
    sources:
      - path: App/TheHud
    dependencies:
      - package: HudCore
        product: HudCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rimorcosmicam.thehud
        PRODUCT_NAME: TheHud
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        # iPhone only: the glasses need a USB-C port that carries DisplayPort.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/TheHud/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
