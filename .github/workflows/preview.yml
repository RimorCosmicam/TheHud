name: build

# Two jobs, because they answer different questions. `engine` runs the input engine's tests and
# renders the HUD to PNG on a Mac with nothing installed — that is the fast loop. `ios` is the
# only place the app is compiled at all, since the development machine has no Xcode.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Test
        run: .build/release/hudtests

      - name: Render
        run: .build/release/hudshot --out out

      - uses: actions/upload-artifact@v4
        with:
          name: hud-preview
          path: out/*.png

  # The Android app, for the Galaxy Z Flip's cover screen: tests, stills of the glasses, and an
  # installable APK (signed with the debug key, so it sideloads without a keystore).
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew testDebugUnitTest

      - name: Render
        run: ./gradlew recordRoborazziDebug

      - name: Build
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: TheHud-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hud-preview-android
          path: out/android/*.png

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # A device build rather than a simulator one, because it is what can be packaged. It also
      # compiles everything the simulator build would, so nothing is lost by having only this.
      - name: Build for device
        run: |
          xcodebuild build \
            -project TheHud.xcodeproj \
            -scheme TheHud \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      # An .ipa is a zip with the .app inside a Payload directory, and nothing more. This one is
      # unsigned: it will not install on a phone until it is signed with an identity, which is a
      # thing only the owner of that identity can do.
      - name: Package unsigned ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/TheHud.app"
          test -d "$APP" || { echo "no .app at $APP"; ls -R build/Build/Products || true; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry TheHud-unsigned.ipa Payload
          ls -lh TheHud-unsigned.ipa

      # An ipa missing these cannot install and cannot be signed, and the failure a signing tool
      # reports for it is not obvious. Fail here instead, where the cause is in front of you.
      - name: Check the bundle is installable
        run: |
          PLIST="Payload/TheHud.app/Info.plist"
          for key in CFBundleIdentifier CFBundleExecutable CFBundleName \
                     CFBundleVersion CFBundleShortVersionString UILaunchScreen; do
            if ! plutil -extract "$key" raw -o - "$PLIST" >/dev/null 2>&1; then
              echo "::error::$key missing from Info.plist"
              plutil -p "$PLIST"
              exit 1
            fi
            echo "ok  $key"
          done
          test -f "Payload/TheHud.app/$(plutil -extract CFBundleExecutable raw -o - "$PLIST")" \
            || { echo "::error::the executable named by CFBundleExecutable is not there"; exit 1; }
          # The icon: actool must have merged CFBundleIcons in and compiled Assets.car.
          plutil -extract CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName raw -o - "$PLIST" \
            || { echo "::error::no app icon in Info.plist"; plutil -p "$PLIST"; exit 1; }
          test -f Payload/TheHud.app/Assets.car \
            || { echo "::error::Assets.car missing"; exit 1; }
          echo "ok  icon"

      - uses: actions/upload-artifact@v4
        with:
          name: TheHud-unsigned-ipa
          path: TheHud-unsigned.ipa
