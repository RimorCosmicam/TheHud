name: build

# Two jobs, because they answer different questions. `engine` runs the input engine's tests and
# renders the HUD to PNG on a Mac with nothing installed — that is the fast loop. `ios` is the
# only place the app is compiled at all, since the development machine has no Xcode.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Test
        run: .build/release/hudtests

      - name: Render
        run: .build/release/hudshot --out out

      - uses: actions/upload-artifact@v4
        with:
          name: hud-preview
          path: out/*.png

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # A device build rather than a simulator one, because it is what can be packaged. It also
      # compiles everything the simulator build would, so nothing is lost by having only this.
      - name: Build for device
        run: |
          xcodebuild build \
            -project TheHud.xcodeproj \
            -scheme TheHud \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      # An .ipa is a zip with the .app inside a Payload directory, and nothing more. This one is
      # unsigned: it will not install on a phone until it is signed with an identity, which is a
      # thing only the owner of that identity can do.
      - name: Package unsigned ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/TheHud.app"
          test -d "$APP" || { echo "no .app at $APP"; ls -R build/Build/Products || true; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry TheHud-unsigned.ipa Payload
          unzip -l TheHud-unsigned.ipa | tail -3
          ls -lh TheHud-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TheHud-unsigned-ipa
          path: TheHud-unsigned.ipa
